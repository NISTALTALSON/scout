[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scout-opportunity-agent"
version = "0.1.0"
description = "Bounded, evidence-driven opportunity intelligence for a student developer"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<1.1",
  "feedparser>=6.0.12,<7", "beautifulsoup4>=4.14,<5",
  "pydantic>=2.12,<3", "PyYAML>=6.0.3,<7", "dateparser>=1.2.2,<2",
  "icalendar>=6.3,<8", "Jinja2>=3.1.6,<4", "portalocker>=3.2,<4",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[project.scripts]
scout = "scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: opt-in external integration check"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
